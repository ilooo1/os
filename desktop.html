<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vardosanidze OS v3.0</title>
<style>
  :root {
    --wall: radial-gradient(circle at 80% 10%, #2563eb 0%, #0f172a 48%, #020617 100%);
    --accent: #38bdf8;
    --glass: rgba(15, 23, 42, 0.65);
    --border: rgba(255, 255, 255, 0.14);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; height: 100vh; background: var(--wall); color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; user-select: none; display: flex; flex-direction: column;
    transition: background 0.6s ease;
  }
  .blur { background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid var(--border); }
  
  /* Верхний статус-бар как в macOS */
  .topbar {
    height: 34px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; font-weight: 500; background: rgba(2, 6, 23, 0.55);
    backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); z-index: 50;
  }
  .brand { display: flex; align-items: center; gap: 6px; font-weight: 700; color: #fff; letter-spacing: 0.3px; }
  .dot-live { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 8px #4ade80; }
  .sys-stats { display: flex; align-items: center; gap: 10px; font-family: monospace; color: #cbd5e1; }
  .fps-badge { color: #4ade80; font-weight: 700; }

  /* Рабочая область */
  .workspace { flex: 1; padding: 18px 16px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }

  /* Виджет системы на рабочем столе */
  .hero-widget {
    border-radius: 20px; padding: 16px; box-shadow: 0 12px 32px rgba(0,0,0,0.4);
    background: linear-gradient(135deg, rgba(30, 41, 59, 0.75), rgba(15, 23, 42, 0.85));
    border: 1px solid rgba(56, 189, 248, 0.25);
  }
  .hw-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .hw-title { font-size: 15px; font-weight: 700; color: #fff; }
  .hw-sub { font-size: 11px; color: #94a3b8; }
  .boost-pill {
    background: rgba(56, 189, 248, 0.15); color: var(--accent); border: 1px solid rgba(56, 189, 248, 0.4);
    padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .boost-pill.active { background: #22c55e; color: #020617; border-color: #22c55e; box-shadow: 0 0 15px rgba(34,197,94,0.4); }
  .quick-ai { display: flex; gap: 8px; }
  .quick-ai input {
    flex: 1; background: rgba(2, 6, 23, 0.6); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 12px; color: #fff; font-size: 13px; outline: none;
  }
  .quick-ai button {
    background: var(--accent); color: #020617; border: none; border-radius: 12px;
    padding: 0 14px; font-weight: 700; cursor: pointer;
  }

  /* Сетка векторных иконок */
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; text-align: center; }
  .app { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; transition: transform 0.15s; }
  .app:active { transform: scale(0.9); }
  .ico {
    width: 56px; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 20px rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.18);
  }
  .ico svg { width: 26px; height: 26px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .g-blue { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
  .g-cyan { background: linear-gradient(135deg, #06b6d4, #0284c7); }
  .g-purple { background: linear-gradient(135deg, #8b5cf6, #5b21b6); }
  .g-dark { background: linear-gradient(135deg, #334155, #0f172a); }
  .app span { font-size: 11px; color: #e2e8f0; font-weight: 500; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }

  /* Плавающий Док как в macOS */
  .dock-wrap { padding: 10px 14px 14px; display: flex; justify-content: center; z-index: 40; }
  .dock {
    display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-radius: 22px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.6);
  }
  .dock-btn {
    width: 44px; height: 44px; border-radius: 13px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform 0.15s; border: 1px solid rgba(255,255,255,0.15);
  }
  .dock-btn:active { transform: scale(0.88); }
  .dock-btn svg { width: 22px; height: 22px; stroke: #fff; fill: none; stroke-width: 2; }
  .sep { width: 1px; height: 28px; background: var(--border); }

  /* Окна */
  .win {
    display: none; position: fixed; top: 46px; left: 50%; transform: translateX(-50%);
    width: 92%; max-width: 410px; border-radius: 18px; z-index: 60;
    box-shadow: 0 25px 60px rgba(0,0,0,0.8); overflow: hidden; animation: pop 0.18s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: translate(-50%, 10px) scale(0.97); } to { opacity: 1; transform: translate(-50%, 0) scale(1); } }
  .win-head {
    background: rgba(2, 6, 23, 0.85); padding: 12px 15px; display: flex;
    justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border);
  }
  .win-dots { display: flex; gap: 7px; }
  .w-dot { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; }
  .win-title { font-size: 13px; font-weight: 600; color: #e2e8f0; }

  /* Чат и терминал */
  .chat-area { height: 240px; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
  .m-ai { background: rgba(56, 189, 248, 0.14); border: 1px solid rgba(56, 189, 248, 0.3); padding: 9px 12px; border-radius: 12px 12px 12px 4px; align-self: flex-start; max-width: 85%; }
  .m-u { background: #2563eb; padding: 9px 12px; border-radius: 12px 12px 4px 12px; align-self: flex-end; max-width: 85%; }
  .term-area { background: #020617; color: #4ade80; font-family: monospace; font-size: 12px; height: 230px; padding: 12px; overflow-y: auto; line-height: 1.5; }

  /* Меню Пуск (V-Menu) */
  #vmenu {
    display: none; position: fixed; bottom: 78px; left: 50%; transform: translateX(-50%);
    width: 90%; max-width: 340px; border-radius: 22px; padding: 16px; z-index: 55;
    box-shadow: 0 20px 50px rgba(0,0,0,0.8);
  }
  .vm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .vm-card {
    background: rgba(255,255,255,0.06); border: 1px solid var(--border); border-radius: 14px;
    padding: 12px; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px;
  }
  .vm-card:active { background: rgba(56, 189, 248, 0.2); }
</style>
</head>
<body>

<!-- Верхний статус-бар -->
<div class="topbar">
  <div class="brand"><div class="dot-live"></div>Vardosanidze OS</div>
  <div class="sys-stats">
    <span class="fps-badge"><span id="fps">60</span> FPS</span>
    <span>RAM 0.5G</span>
    <span id="clock">18:00</span>
  </div>
</div>

<!-- Рабочий стол -->
<div class="workspace">
  <div class="hero-widget blur">
    <div class="hw-top">
      <div>
        <div class="hw-title">Привет, Илья</div>
        <div class="hw-sub" id="sys-status">Профиль: Сбалансированный • DPI Активен</div>
      </div>
      <button class="boost-pill" id="boost-btn" onclick="toggleBoost()">⚡ Game Boost</button>
    </div>
    <div class="quick-ai">
      <input id="w-in" placeholder="Спроси ИИ (память, буст, сеть)...">
      <button onclick="quickAsk()">→</button>
    </div>
  </div>

  <!-- Иконки приложений -->
  <div class="grid">
    <div class="app" onclick="openWin('win-cc')">
      <div class="ico g-blue"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div>
      <span>Центр ОС</span>
    </div>
    <div class="app" onclick="openWin('win-ai')">
      <div class="ico g-cyan"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></svg></div>
      <span>ИИ Ядро</span>
    </div>
    <div class="app" onclick="openWin('win-term')">
      <div class="ico g-dark"><svg viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg></div>
      <span>Терминал</span>
    </div>
    <div class="app" onclick="nextWall()">
      <div class="ico g-purple"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div>
      <span>Обои</span>
    </div>
  </div>
</div>

<!-- Плавающий Док -->
<div class="dock-wrap">
  <div class="dock blur">
    <div class="dock-btn g-blue" onclick="toggleMenu()"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg></div>
    <div class="sep"></div>
    <div class="dock-btn g-cyan" onclick="openWin('win-ai')"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
